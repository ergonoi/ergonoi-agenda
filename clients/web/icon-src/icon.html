<!DOCTYPE html>
<!-- Source of the app icons, rendered by render.mjs: ?t=outheis|ergonoi&s=<size> (default
     outheis, 512). outheis: Pearl Aqua over Wisteria, A in Inter 600 (docs/ui.md 2.7);
     ergonoi: Pearl Aqua from 50 % at the top to full, A in Mona Sans Mono Bold (2.10). Fonts from
     ../fonts (OFL). -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family:Inter; font-weight:100 900; src:url(../fonts/inter-latin-wght.woff2); }
@font-face { font-family:Mona; font-weight:700; src:url(../fonts/mona-sans-mono-bold-latin.woff2); }
html, body { margin:0; }
#icon { position:relative; overflow:hidden; }
#icon span { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; line-height:1; }
.outheis { background:linear-gradient(#97EAD2 0 37.5%, #C490D1 37.5% 100%); }
.outheis span { color:#460A46; font-family:Inter; font-weight:600; }
.ergonoi { background:linear-gradient(#CBF5E9, #97EAD2); } /* Pearl Aqua, 50 % at the top to full at the bottom */
.ergonoi span { color:#1A1A1A; font-family:Mona; font-weight:700; }
</style></head><body><div id="icon"><span>A</span></div>
<script>
const q = new URLSearchParams(location.search), s = Number(q.get("s")) || 512, t = q.get("t") || "outheis";
const el = document.getElementById("icon");
el.className = t; el.style.width = el.style.height = s + "px";
const sp = el.querySelector("span");
sp.style.fontSize = (s * 150 / 180 * (t === "ergonoi" ? 0.9 : 1)) + "px";
// ergonoi: the A of Mona Sans Mono is set at 90 % and stretched back to full height, so that
// its legs weigh as much as the strokes of the M in the Map icon
if (t === "ergonoi") sp.style.transform = "translateY(-50%) scaleY(1.111)";
</script></body></html>
