# Builds the user documentation (site/) and publishes it as the GitHub Pages site of the repository.
# Manual only while the repository is private and Pages is not set up.
# Once the repository is public and Pages is set to "GitHub Actions", add again:
#   push:
#     branches: [main]
#     paths: ["site/**", "VERSION"]
name: Documentation site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python site/scripts/build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/html
      - id: deployment
        uses: actions/deploy-pages@v4
