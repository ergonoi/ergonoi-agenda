# Stage 2: reverse proxy to agenda-service.
# Replaces the placeholder "location /" inside the "listen 443" server block
# that certbot created for agenda.example.org (see deploy/DEPLOY.md, step 7).

    # The journal limit is 5 MB; replacing the file (compaction) sends it whole.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:41380;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
