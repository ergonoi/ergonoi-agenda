# Stage 1: placeholder until agenda-service runs.
# Install as /etc/nginx/sites-available/agenda.example.org (replace the domain),
# enable, reload, then run certbot (see deploy/DEPLOY.md, step 4).
server {
    listen 80;
    listen [::]:80;
    server_name agenda.example.org;

    location / {
        return 503 "agenda: service not yet running\n";
    }
}
